    <div class="container py-5">
        <h1 class="text-center">常見問題</h1>
        
        <div class="mb-5">
            <h2 class="fs-2">1. 忘記吃藥怎麼辦?</h2>
            <p class="fs-3">答：想到就趕快吃。但如果快要吃下一餐的藥了，就不要補吃，以免藥量過多。</p>
        </div>

        <div class="mb-5">
            <h2 class="fs-2">2. 藥可以配茶喝嗎?</h2>
            <p class="fs-3">答：不可以。請務必使用溫開水配藥，以免影響藥效。</p>
        </div>

        <div class="mb-5">
            <h2 class="fs-2">3. 藥沒吃完怎麼辦?</h2>
            <p class="fs-3">答：請把藥帶回醫院或藥局回收，不要隨便丟進垃圾桶。</p>
        </div>
    </div>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用藥指引</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fs-2" href="index.html">用藥指引</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="index.html">首頁</a>
                <a class="nav-link" href="faq.html">說明</a>
                <a class="nav-link text-warning" href="contact.html">聯絡</a>
            </div>
        </div>
    </nav>

    <div class="container text-center py-5">
        <h1>現在時間</h1>
        <div id="clock" class="display-1 fw-bold text-primary mb-5">00:00:00</div>
        
        <div class="p-4 border border-3 rounded-4 bg-light">
            <h2 class="text-danger">📢 提醒：晚飯後要吃藥</h2>
            <p class="fs-3">請服用：降血壓藥 (半顆)</p>
            <button class="btn btn-success btn-huge" onclick="alert('記錄成功！')">我已經吃藥了</button>
        </div>
    </div>

    <script>
        function showTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-TW', {hour12:false});
        }
        setInterval(showTime, 1000);
        showTime();
    </script>
</body>
</html>
